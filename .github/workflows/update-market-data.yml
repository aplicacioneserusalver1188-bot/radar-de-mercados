name: Actualizar datos de mercado
on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_data.py
      - run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add data/market.json
          git diff --staged --quiet || git commit -m "Actualizar datos de mercado"
          git push
