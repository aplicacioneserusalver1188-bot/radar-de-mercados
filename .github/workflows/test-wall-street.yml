name: Validar informe de Wall Street (sin correo)
on:
  pull_request:
    paths:
      - 'scripts/daily_wall_street.py'
      - 'scripts/update_sec.py'
      - 'scripts/update_data.py'
      - 'tests/**'
      - '.github/workflows/test-wall-street.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis
        run: python -m compileall -q scripts tests
      - name: Ejecutar pruebas unitarias sin conexión
        run: python -m unittest discover -s tests -v
