name: Validar informe de Wall Street (sin correo)
on:
  pull_request:
    paths:
      - 'scripts/daily_wall_street.py'
      - 'scripts/macro_story.py'
      - 'scripts/update_price_history.py'
      - 'scripts/render_charts.py'
      - 'scripts/news_story.py'
      - 'scripts/news_offline_es.py'
      - 'scripts/setup_offline_translation.py'
      - 'scripts/update_breadth.py'
      - 'scripts/update_sec.py'
      - 'scripts/update_wall_street_data.py'
      - 'tests/**'
      - '.github/workflows/test-wall-street.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis
        run: python -m compileall -q scripts tests
      - name: Ejecutar pruebas unitarias sin conexión
        run: python -m unittest discover -s tests -v
      - name: Consultar series FRED reales
        run: python scripts/update_wall_street_data.py
      - name: Consultar referencias de activos
        run: python scripts/update_references.py
      - name: Consultar históricos gratuitos para gráficos
        run: python scripts/update_price_history.py
      - name: Instalar generador gratuito de gráficos
        run: python -m pip install --disable-pip-version-check -q matplotlib
      - name: Consultar amplitud de índices
        run: python scripts/update_breadth.py
      - name: Preparar traductor local gratuito inglés-español
        run: |
          python -m pip install --disable-pip-version-check -q argostranslate
          python scripts/setup_offline_translation.py
        timeout-minutes: 5
        continue-on-error: true
      - name: Consultar SEC real sin credenciales
        env:
          SEC_USER_AGENT: "ObservatorioRM/1.0 (contact: https://github.com/aplicacioneserusalver1188-bot/radar-de-mercados)"
        run: python scripts/update_sec.py
      - name: Generar informe con datos reales sin enviar correo
        env:
          RADAR_DRY_RUN: "1"
        run: python scripts/daily_wall_street.py
      - name: Conservar informe de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-prueba-wall-street
          path: |
            reports/wall-street-latest.html
            reports/charts/*.png
          if-no-files-found: warn
