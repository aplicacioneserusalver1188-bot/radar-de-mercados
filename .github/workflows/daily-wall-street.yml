name: Radar diario Wall Street (Gmail)
on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: 'Enviar una sola prueba real por correo (desactivado por defecto)'
        type: boolean
        default: false
  schedule:
    # Respaldo: Cloudflare inicia a las 07:00 VET. GitHub revisa a las 07:30
    # y solo envía si no hay una ejecución externa exitosa de esta edición.
    - cron: '30 11 * * *'
permissions:
  contents: read
  actions: read
jobs:
  comprobar-respaldo:
    runs-on: ubuntu-latest
    outputs:
      enviar_respaldo: ${{ steps.verificar.outputs.enviar_respaldo }}
    steps:
      - id: verificar
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "enviar_respaldo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hoy_vet=$(TZ=America/Caracas date +%F)
          exitosas=$(gh api \
            "/repos/$REPOSITORY/actions/workflows/daily-wall-street.yml/runs?event=workflow_dispatch&per_page=50" \
            --jq ".workflow_runs | map(select(.conclusion == \"success\" and (.created_at | startswith(\"$hoy_vet\")))) | length")
          if [ "$exitosas" -gt 0 ]; then
            echo "Cloudflare ya inició y completó el informe de hoy; respaldo omitido."
            echo "enviar_respaldo=false" >> "$GITHUB_OUTPUT"
          else
            echo "No hay informe externo exitoso hoy; se activa el respaldo GitHub."
            echo "enviar_respaldo=true" >> "$GITHUB_OUTPUT"
          fi
  informe:
    needs: comprobar-respaldo
    if: ${{ always() && (github.event_name != 'schedule' || needs.comprobar-respaldo.outputs.enviar_respaldo == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar código y pruebas del informe
        env:
          # Las pruebas comprueban que la consulta SEC usa una identificación
          # válida; debe estar disponible antes del paso de actualización SEC.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m compileall -q scripts/daily_wall_street.py scripts/update_sec.py
          python -m unittest discover -s tests -v
      - name: Actualizar indicadores públicos
        run: python scripts/update_wall_street_data.py
      - name: Actualizar referencias oro petróleo y Bitcoin
        run: python scripts/update_references.py
      - name: Consultar históricos gratuitos para gráficos
        run: python scripts/update_price_history.py
      - name: Instalar generador gratuito de gráficos
        run: python -m pip install --disable-pip-version-check -q matplotlib
      - name: Consultar noticias recientes por empresa (fuentes gratuitas)
        run: python scripts/update_company_news.py
        timeout-minutes: 3
        continue-on-error: true
      - name: Seleccionar hasta cinco noticias relevantes de Wall Street
        run: python scripts/update_market_top_news.py
        timeout-minutes: 3
        continue-on-error: true
      - name: Calcular amplitud S&P 500 y Nasdaq 100
        run: python scripts/update_breadth.py
      - name: Preparar agenda de la próxima semana
        run: python scripts/update_week_ahead.py
      - name: Preparar traductor local gratuito inglés-español
        run: |
          python -m pip install --disable-pip-version-check -q argostranslate
          python scripts/setup_offline_translation.py
        timeout-minutes: 6
        continue-on-error: true
      - name: Obtener cifras empresariales SEC
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/update_sec.py
      - name: Generar informe y enviar Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          # El cron diario envía. Una ejecución manual solo puede hacerlo mediante
          # el interruptor explícito send_test_email, cuyo valor por defecto es falso.
          RADAR_DRY_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_test_email == true)) && '0' || '1' }}
        run: python scripts/daily_wall_street.py
      - name: Conservar informe como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-wall-street
          path: |
            reports/wall-street-latest.html
            reports/charts/*.png
          if-no-files-found: warn
