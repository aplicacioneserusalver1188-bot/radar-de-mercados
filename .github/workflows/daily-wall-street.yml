name: Radar diario Wall Street (Gmail)
on:
  workflow_dispatch:
    # Las ejecuciones manuales siempre son una vista previa: no pueden enviar correo.
  schedule:
    # Venezuela UTC-4 todo el año: 07:00 = 11:00 UTC. Cron envia correo real.
    - cron: '0 11 * * *'
permissions:
  contents: read
jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar código y pruebas del informe
        run: |
          python -m compileall -q scripts/daily_wall_street.py scripts/update_sec.py
          python -m unittest discover -s tests -v
      - name: Actualizar indicadores públicos
        run: python scripts/update_wall_street_data.py
      - name: Actualizar referencias oro petróleo y Bitcoin
        run: python scripts/update_references.py
      - name: Consultar históricos gratuitos para gráficos
        run: python scripts/update_price_history.py
      - name: Instalar generador gratuito de gráficos
        run: python -m pip install --disable-pip-version-check -q matplotlib
      - name: Consultar noticias recientes por empresa (fuentes gratuitas)
        run: python scripts/update_company_news.py
        timeout-minutes: 3
        continue-on-error: true
      - name: Seleccionar hasta cinco noticias relevantes de Wall Street
        run: python scripts/update_market_top_news.py
        timeout-minutes: 3
        continue-on-error: true
      - name: Calcular amplitud S&P 500 y Nasdaq 100
        run: python scripts/update_breadth.py
      - name: Preparar traductor local gratuito inglés-español
        run: |
          python -m pip install --disable-pip-version-check -q argostranslate
          python scripts/setup_offline_translation.py
        timeout-minutes: 6
        continue-on-error: true
      - name: Obtener cifras empresariales SEC
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/update_sec.py
      - name: Generar informe y enviar Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          # Solo el programador diario puede activar el transporte SMTP. Esto evita
          # que una prueba manual entregue correos si GitHub interpreta un input de
          # formulario de forma inesperada.
          RADAR_DRY_RUN: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: python scripts/daily_wall_street.py
      - name: Conservar informe como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-wall-street
          path: |
            reports/wall-street-latest.html
            reports/charts/*.png
          if-no-files-found: warn
