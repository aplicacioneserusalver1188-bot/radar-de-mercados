name: Radar diario de criptomonedas (Gmail)
on:
  push:
    paths:
      - 'ops/trigger-crypto-email.txt'
  schedule:
    # 07:00 hora de Venezuela = 11:00 UTC, todos los días.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      send_test_email:
        description: 'Enviar prueba real a Gmail (por defecto no)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: radar-diario-cripto
  cancel-in-progress: false
jobs:
  radar-cripto:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis
        run: python -m py_compile scripts/daily_crypto.py
      - name: Generar reporte y enviar a Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          RADAR_DRY_RUN: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.send_test_email == true)) && '0' || '1' }}
        run: python scripts/daily_crypto.py
      - name: Guardar copia del informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-cripto
          path: reports/crypto-latest.html
          if-no-files-found: warn
