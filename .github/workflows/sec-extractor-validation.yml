name: SEC extractor validation
on:
  push:
    branches:
      - dev/observatorio-rm-fuentes-20261013
    paths:
      - 'worker/template.mjs'
      - 'tests/sec_filing_extractor.test.cjs'
      - 'package.json'
      - '.github/workflows/sec-extractor-validation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
