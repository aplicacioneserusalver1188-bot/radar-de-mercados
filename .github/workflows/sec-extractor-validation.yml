name: SEC extractor validation
on:
  push:
    branches:
      - dev/observatorio-rm-fuentes-20261013
    paths:
      - 'worker/template.mjs'
      - 'consultor.html'
      - 'tests/dcf_consultor.test.cjs'
      - 'tests/sec_filing_extractor.test.cjs'
      - 'tests/sec_financial_series.test.cjs'
      - 'tests/sec_live_smoke.cjs'
      - 'package.json'
      - '.github/workflows/sec-extractor-validation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build

  live-sec-smoke:
    # Opt in from this development branch without adding the workflow to main.
    if: github.ref == 'refs/heads/dev/observatorio-rm-fuentes-20261013' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sec-live]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate NVIDIA real 10-K (requires SEC_USER_AGENT secret)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node tests/sec_live_smoke.cjs
